---
- name: Verify
  hosts: all
  become: true
  tasks:
    - name: Gather installed package facts.
      ansible.builtin.package_facts:
        manager: auto

    - name: Assert the Alert Logic collector package is installed.
      ansible.builtin.assert:
        that:
          - "'al-log-syslog' in ansible_facts.packages"
        fail_msg: al-log-syslog package is not installed.

    - name: Stat the al-remote collector binary.
      ansible.builtin.stat:
        path: /var/alertlogic/lib/remote/bin/al-remote
      register: al_remote_bin

    - name: Assert the al-remote collector binary is installed and executable.
      ansible.builtin.assert:
        that:
          - al_remote_bin.stat.exists
          - al_remote_bin.stat.isreg
          - al_remote_bin.stat.mode == '0755'
        fail_msg: /var/alertlogic/lib/remote/bin/al-remote is missing or not mode 0755.
